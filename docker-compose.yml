services:
  redis:
    image: redis:7-alpine
    container_name: docuflow-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "6379:6379"
    volumes:
      - docuflow_redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: docuflow-minio
    restart: unless-stopped
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-docuflow}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-docuflow-local-secret}
    ports:
      - "9000:9000"
      - "9002:9001"
    volumes:
      - docuflow_minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: docuflow-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-docuflow}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-docuflow-local-secret}
      SOURCE_BUCKET: ${S3_BUCKET_SOURCE_INVOICES:-source-invoices}
      DERIVED_BUCKET: ${S3_BUCKET_DERIVED_PAGES:-derived-pages}
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Waiting for MinIO..."

        until /usr/bin/mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          sleep 2
        done

        /usr/bin/mc mb --ignore-existing "local/$$SOURCE_BUCKET"
        /usr/bin/mc mb --ignore-existing "local/$$DERIVED_BUCKET"

        echo "MinIO buckets are ready."
        exit 0

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docuflow-api
    restart: unless-stopped
    env_file:
      - .env
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./scripts:/app/scripts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docuflow-worker
    restart: unless-stopped
    env_file:
      - .env
    command:
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=2
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: docuflow-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DOCUFLOW_API_INTERNAL_URL: http://api:8000
      DOCUFLOW_DEMO_AUTH_ENABLED: ${DOCUFLOW_DEMO_AUTH_ENABLED:-true}
      NEXT_TELEMETRY_DISABLED: "1"
    command:
      - npm
      - run
      - dev
      - --
      - --hostname
      - 0.0.0.0
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - docuflow_frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_started

volumes:
  docuflow_redis_data:
  docuflow_minio_data:
  docuflow_frontend_node_modules:
